<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New',monospace">
<style>.bg{fill:#1a1a1a}.fg{fill:#e6e6e6;font-size:12px}.dim{fill:#666;font-size:12px}.grn{fill:#5dcaa5;font-size:12px}.red{fill:#f09595;font-size:12px}.yel{fill:#fac775;font-size:12px}.cyn{fill:#7bb6f0;font-size:12px}.bold{font-weight:700}.hdr{fill:#333}.bar{fill:#444;rx:2}</style>
<rect width="900" height="600" class="bg"/>

<!-- Title bar -->
<rect x="0" y="0" width="900" height="22" class="hdr"/>
<text x="450" y="15" text-anchor="middle" class="grn bold" style="font-size:13px"> CPCU MONITOR — InfiniTech Prosthetic Hand </text>

<!-- Tab bar -->
