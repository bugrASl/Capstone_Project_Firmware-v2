<text x="10" y="198" class="dim">ch0</text><rect x="40" y="189" width="130" height="12" class="bar"/><rect x="40" y="189" width="81" height="12" fill="#5dcaa5" rx="2"/><text x="180" y="199" class="dim">62%</text>
<text x="10" y="214" class="dim">ch1</text><rect x="40" y="205" width="130" height="12" class="bar"/><rect x="40" y="205" width="23" height="12" fill="#5dcaa5" rx="2"/><text x="180" y="215" class="dim">18%</text>
<text x="10" y="230" class="dim">ch2</text><rect x="40" y="221" width="130" height="12" class="bar"/><rect x="40" y="221" width="10" height="12" fill="#5dcaa5" rx="2"/><text x="180" y="231" class="dim"> 8%</text>
<text x="10" y="246" class="dim">ch3</text><rect x="40" y="237" width="130" height="12" class="bar"/><rect x="40" y="237" width="29" height="12" fill="#5dcaa5" rx="2"/><text x="180" y="247" class="dim">22%</text>

<text x="240" y="198" class="dim">ch4</text><rect x="270" y="189" width="130" height="12" class="bar"/><rect x="270" y="189" width="58" height="12" fill="#7bb6f0" rx="2"/><text x="410" y="199" class="dim">45%</text>
