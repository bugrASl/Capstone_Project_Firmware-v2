<text x="10" y="328" class="dim">S2 Last </text><text x="90" y="328" class="fg">1680</text>
<text x="10" y="344" class="dim">S3 Jnt-1</text><text x="90" y="344" class="fg">1710</text>
<text x="10" y="360" class="dim">S4 Jnt-2</text><text x="90" y="360" class="fg">1690</text>
