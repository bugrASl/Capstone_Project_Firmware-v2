<text x="90" y="38" class="dim">2:RADIO</text>
<text x="170" y="38" class="dim">3:DSP</text>
<text x="240" y="38" class="dim">4:WAVES</text>
<text x="320" y="38" class="dim">5:HEALTH</text>
<text x="410" y="38" class="dim">6:DATASET</text>
<text x="510" y="38" class="dim">7:CONFIG</text>
<rect x="0" y="44" width="900" height="1" fill="#333"/>

<!-- Page 1: Overview -->
<text x="10" y="66" class="fg bold">SYSTEM</text>
<text x="200" y="66" class="fg bold">RADIO LINK</text>

<text x="10" y="84" class="dim">State:</text><text x="80" y="84" class="grn bold">RUNNING</text>
<text x="10" y="100" class="dim">Uptime:</text><text x="80" y="100" class="fg">01:23:45</text>
<text x="10" y="116" class="dim">IO ready:</text><text x="80" y="116" class="grn">YES</text>
<text x="10" y="132" class="dim">DSP ready:</text><text x="80" y="132" class="grn">YES</text>
<text x="10" y="148" class="dim">NRF init:</text><text x="80" y="148" class="grn">OK</text>

<text x="200" y="84" class="dim">Packets/s:</text><text x="290" y="84" class="fg">998</text>
<text x="200" y="100" class="dim">Total pkts:</text><text x="290" y="100" class="fg">5432100</text>
