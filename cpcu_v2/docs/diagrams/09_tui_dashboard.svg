<text x="240" y="230" class="dim">ch6</text><rect x="270" y="221" width="130" height="12" class="bar"/><rect x="270" y="221" width="7" height="12" fill="#7bb6f0" rx="2"/><text x="410" y="231" class="dim"> 5%</text>
<text x="240" y="246" class="dim">ch7</text><rect x="270" y="237" width="130" height="12" class="bar"/><rect x="270" y="237" width="12" height="12" fill="#7bb6f0" rx="2"/><text x="410" y="247" class="dim"> 9%</text>

<rect x="0" y="258" width="900" height="1" fill="#333"/>

