<text x="350" y="296" class="dim">Voltage:</text><text x="430" y="296" class="grn">3.82 V</text>
<text x="350" y="312" class="dim">Level:</text><text x="430" y="312" class="grn">OK</text>
<text x="350" y="344" class="dim">Ring fill:</text><text x="430" y="344" class="fg">3 / 1024</text>
<text x="350" y="360" class="dim">Overflows:</text><text x="430" y="360" class="grn">0</text>
<text x="350" y="376" class="dim">Grip stalls:</text><text x="430" y="376" class="grn">0</text>

<rect x="0" y="388" width="900" height="1" fill="#333"/>

<!-- Classification -->
<text x="10" y="408" class="fg bold">ML CLASSIFICATION</text>
<text x="10" y="428" class="dim">Gesture:</text><text x="80" y="428" class="grn bold" style="font-size:16px">HAND SLOW</text><text x="220" y="428" class="dim">87%</text><text x="280" y="428" class="dim">Inf: 28 ms</text>

<text x="10" y="448" class="dim">REST  </text><rect x="70" y="439" width="100" height="10" class="bar"/><rect x="70" y="439" width="5" height="10" fill="#444" rx="1"/><text x="180" y="448" class="dim"> 5%</text>
<text x="10" y="462" class="dim">H.SLO </text><rect x="70" y="453" width="100" height="10" class="bar"/><rect x="70" y="453" width="87" height="10" fill="#5dcaa5" rx="1"/><text x="180" y="462" class="grn bold">87% ◄</text>
<text x="10" y="476" class="dim">H.HRD </text><rect x="70" y="467" width="100" height="10" class="bar"/><rect x="70" y="467" width="3" height="10" fill="#444" rx="1"/><text x="180" y="476" class="dim"> 3%</text>
<text x="10" y="490" class="dim">H.OPN </text><rect x="70" y="481" width="100" height="10" class="bar"/><rect x="70" y="481" width="2" height="10" fill="#444" rx="1"/><text x="180" y="490" class="dim"> 2%</text>

<text x="240" y="448" class="dim">A.BND&lt;</text><rect x="300" y="439" width="100" height="10" class="bar"/><rect x="300" y="439" width="1" height="10" fill="#444" rx="1"/><text x="410" y="448" class="dim">1%</text>
<text x="240" y="462" class="dim">A.BND=</text><rect x="300" y="453" width="100" height="10" class="bar"/><text x="410" y="462" class="dim">0%</text>
<text x="240" y="476" class="dim">A.BND&gt;</text><rect x="300" y="467" width="100" height="10" class="bar"/><rect x="300" y="467" width="1" height="10" fill="#444" rx="1"/><text x="410" y="476" class="dim">1%</text>
<text x="240" y="490" class="dim">BICEP </text><rect x="300" y="481" width="100" height="10" class="bar"/><text x="410" y="490" class="dim">0%</text>

<!-- Footer -->
<rect x="0" y="510" width="900" height="1" fill="#333"/>
<text x="10" y="530" class="dim">Page 1/7 · q:quit  1-7:pages  e:edit(config)  w:wave-type  TAB:toggle · 10 Hz refresh</text>

<!-- Page indicators on right -->
<rect x="550" y="56" width="340" height="440" rx="8" fill="none" stroke="#333" stroke-dasharray="4,4"/>
<text x="720" y="76" text-anchor="middle" class="dim" style="font-size:10px">Other pages (press 2-7):</text>
<text x="570" y="100" class="cyn" style="font-size:11px">2 RADIO/IO    Detailed NRF stats, SPI status</text>
<text x="570" y="120" class="cyn" style="font-size:11px">3 DSP/AI      8-ch wave grid, inference detail</text>
<text x="570" y="140" class="cyn" style="font-size:11px">4 WAVES       Full waveform (TAB: single/all)</text>
<text x="570" y="160" class="cyn" style="font-size:11px">5 HEALTH      All 7 fault src, thermal, ring</text>
<text x="570" y="180" class="cyn" style="font-size:11px">6 DATASET     EMG capture to CSV for training</text>
<text x="570" y="200" class="cyn" style="font-size:11px">7 CONFIG      Runtime tuning + live editor</text>
<text x="570" y="230" class="yel" style="font-size:11px">Press 'e' on CONFIG page to enter</text>
<text x="570" y="248" class="yel" style="font-size:11px">live edit mode (arm parks at neutral)</text>
<text x="570" y="266" class="yel" style="font-size:11px">Ctrl+S saves → SIGHUP → kernel reloads</text>

<text x="570" y="300" class="grn" style="font-size:11px">Demo mode: ./launch.sh test-signal-demo</text>
<text x="570" y="318" class="grn" style="font-size:11px">Synthetic 100 Hz sines, no hardware needed</text>
<text x="570" y="336" class="grn" style="font-size:11px">Fault injection: F=radio B=batt G=gaps</text>
</svg>