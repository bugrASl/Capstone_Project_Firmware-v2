<text x="65" y="475" style="font-size:10.5px;fill:#555">• Read-only: browsers cannot affect the running system</text>
<text x="65" y="491" style="font-size:10.5px;fill:#555">• Multi-viewer: up to 16 simultaneous browser clients tested</text>
<text x="65" y="507" style="font-size:10.5px;fill:#555">• Auto-reconnect with exponential backoff (250 ms → 5 s cap)</text>
<text x="470" y="475" style="font-size:10.5px;fill:#555">• State frame: 10 Hz JSON broadcast (~1.5 KB/frame)</text>
<text x="470" y="491" style="font-size:10.5px;fill:#555">• Wave frame: 20 Hz JSON broadcast (~6 KB/frame)</text>
<text x="470" y="507" style="font-size:10.5px;fill:#555">• Dark/light theme follows prefers-color-scheme</text>
